name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ยกเลิกรอบเก่าถ้ามี push ใหม่เข้ามา branch เดิม
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Install, Build, Lint, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show environment
        run: |
          node -v
          npm -v

      # 1) Install Dependencies
      # ถ้าล้ม ให้ยิงข้อความ error ของ npm ออกมาเป็น annotation
      # เพื่อไม่ต้องเปิด log เพื่อดูว่าล้มที่อะไร
      - name: Install Dependencies
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E 'npm (error|ERR!)' /tmp/npm-ci.log | head -25 | sed 's/%/%25/g' | tr '\n' ' ')
            echo "::error title=npm ci failed (exit $status)::$msg"
          fi
          exit $status

      # 2) Build Project
      # ไม่ต้องใส่ secret: lib/env.ts ตรวจว่ามีค่า env หรือไม่ และแสดงข้อความแนะนำ
      # แทนการ throw ดังนั้น build ผ่านได้แม้ยังไม่ได้ตั้งค่า Supabase
      - name: Build Project
        run: npm run build

      # 3) Lint
      - name: Lint
        run: npm run lint

      # ใช้ npm exec แทน npx เพื่อไม่ให้ npx ไปหาแพ็กเกจจาก registry
      - name: TypeScript
        run: npm exec tsc -- --noEmit

      # 4) Test
      - name: Test (dark palette contrast, WCAG AA)
        run: npm run check:contrast
